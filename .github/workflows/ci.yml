name: CI

# Every suite runs on every pull request. #35 (money-path invariants) and #37
# (verdict agreement) say "enforced in CI"; this is the workflow that lets them
# actually fail a build. A green run has to exercise all four runtimes.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing in CI may reach a chain, Circle or GitHub. The simulation is the default;
  # it is set here so a changed default cannot quietly start making real calls.
  MISTHOS_SIMULATED: "true"

jobs:
  backend:
    name: backend - ruff and pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run setup:backend
      - run: mise run lint:backend
      - run: mise run test:backend

  # The same backend suite against a real Postgres. MISTHOS_DATABASE_URL switches the
  # store from memory to the SQL repository, so every API and lifecycle test also
  # proves the schema, the migrations and the save path (#23).
  backend-postgres:
    name: backend - pytest against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: misthos
          POSTGRES_PASSWORD: misthos
          POSTGRES_DB: misthos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U misthos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MISTHOS_DATABASE_URL: postgresql+psycopg://misthos:misthos@localhost:5432/misthos
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run setup:backend
      - run: mise run test:backend

  web:
    name: web - tsc and vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run setup:web
      - run: mise run lint:web
      - run: mise run test:web

  edge:
    name: edge - tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run setup:edge
      - run: mise run lint:edge

  contracts:
    name: contracts - forge test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run setup:contracts
      - run: mise run test:contracts
