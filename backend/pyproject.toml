[project]
name = "misthos"
version = "0.1.0"
description = "Marketplace where a company or maintainer puts a fixed price on a GitHub issue and pays whoever fixes it"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    # The CI workflow guard test reads .github/workflows/ci.yml.
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/misthos"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The seed data is prose: issue titles, summaries and acceptance criteria.
# Wrapping those to 100 columns would make them harder to read, not easier.
"src/misthos/store.py" = ["E501"]
