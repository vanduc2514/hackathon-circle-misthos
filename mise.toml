[tools]
node = "22"
npm = "10.9.3"
# Circle's official CLI sits far below aube's reputation threshold (693 weekly
# downloads against 1000), so mise refuses to install it without an explicit
# approval. The exemption is scoped to this package: transitive dependencies stay
# gated, and aube's malicious-package check still runs.
"npm:@circle-fin/cli" = { version = "latest", allow_low_downloads = true }
python = "3.11"
uv = "0.11.6"
foundry = "latest"

[env]
_.file = ".env"

[tasks.dev]
description = "Run the API and the web app together"
run = "mise run dev:api & mise run dev:web"

[tasks."dev:api"]
description = "FastAPI on :8000 with reload"
dir = "backend"
run = "uv run uvicorn misthos.main:app --reload --port 8000"

[tasks."dev:web"]
description = "Vite dev server on :5173"
dir = "frontend"
run = "npm run dev"

[tasks."dev:worker"]
description = "Run the sweeper as its own process (needs MISTHOS_DATABASE_URL)"
dir = "backend"
run = "uv run python -m misthos.workers"

[tasks."db:migrate"]
description = "Migrate MISTHOS_DATABASE_URL to the latest schema"
dir = "backend"
run = "uv run alembic upgrade head"

[tasks."review:harness"]
description = "Replay the review agent over the regression corpus and report agreement"
dir = "backend"
run = "uv run python -m misthos.services.review.harness"

[tasks."pricing:calibrate"]
description = "Replay the pricing engine over issues of known worth and fit the rate and weights"
dir = "backend"
run = "uv run python -m misthos.services.calibration"

[tasks."compose:up"]
description = "Build and run the whole system: web, api, worker, edge, Postgres and Redis"
run = "docker compose up --build"

[tasks."contracts:deploy"]
description = "Deploy MisthosEscrow to Arc testnet with the misthos-deployer keystore"
dir = "contracts"
run = "forge script script/Deploy.s.sol --rpc-url arc_testnet --account misthos-deployer --broadcast"

[tasks."dev:edge"]
description = "x402 gate and Circle CLI bridge on :8080"
dir = "edge"
run = "npm run dev"

[tasks.setup]
description = "Install every runtime's dependencies"
depends = ["setup:backend", "setup:web", "setup:edge", "setup:contracts"]

[tasks."setup:backend"]
description = "Install the backend's Python dependencies"
dir = "backend"
run = "uv sync --extra dev"

[tasks."setup:web"]
description = "Install the web app's npm dependencies"
dir = "frontend"
run = "npm install"

[tasks."setup:edge"]
description = "Install the edge service's npm dependencies"
dir = "edge"
run = "npm install"

[tasks."setup:contracts"]
description = "Clone the Foundry dependencies"
dir = "contracts"
run = "test -d lib/forge-std || git clone --depth 1 https://github.com/foundry-rs/forge-std.git lib/forge-std"

[tasks.test]
description = "Run every test suite"
run = "mise run test:backend && mise run test:web && mise run test:contracts"

[tasks."test:backend"]
dir = "backend"
run = "uv run pytest -q"

[tasks."test:web"]
dir = "frontend"
run = "npm run test"

[tasks."setup:e2e"]
description = "Install Chromium, and what it needs, for the browser tests"
dir = "frontend"
run = "npx playwright install --with-deps chromium"

[tasks."test:e2e"]
description = "Drive the whole loop in a browser, publisher and contributor (starts the API and the web app)"
dir = "frontend"
run = "npx playwright test"

[tasks."test:contracts"]
dir = "contracts"
run = "forge test -vvv"

[tasks.lint]
description = "Lint and typecheck"
depends = ["lint:backend", "lint:web", "lint:edge"]

[tasks."lint:backend"]
description = "Ruff over the backend"
dir = "backend"
run = "uv run ruff check src tests"

[tasks."lint:web"]
description = "Typecheck the web app and its browser tests"
dir = "frontend"
run = "npx tsc --noEmit && npx tsc --noEmit -p tsconfig.e2e.json"

[tasks."lint:edge"]
description = "Typecheck the edge service"
dir = "edge"
run = "npx tsc --noEmit"

[tasks.ci]
description = "Run everything CI runs on a pull request"
run = "mise run lint && mise run test"

[tasks.codegen]
description = "Regenerate the frontend API client from the live OpenAPI schema"
run = "cd frontend && npm run codegen"

[tasks.reset]
description = "Reset the simulated data back to the seed"
run = "curl -s -X POST http://127.0.0.1:8000/api/v1/demo/reset"
