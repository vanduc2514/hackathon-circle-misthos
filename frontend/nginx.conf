# The web app and the API on one origin. /internal/metrics is deliberately not
# proxied: it is for the metrics scraper, not the public.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Overwrite, never append. `$proxy_add_x_forwarded_for` keeps whatever the
        # caller sent and appends the real address, and uvicorn reads the leftmost
        # entry, so a caller could choose the rate-limit key it is limited by and the
        # `actor` on every log line. `$remote_addr` is the address nginx itself saw.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # One correlation id from the edge of the system to the last log line.
        proxy_set_header X-Request-ID $request_id;
    }

    location = /docs {
        proxy_pass http://api:8000;
    }

    location = /openapi.json {
        proxy_pass http://api:8000;
    }

    # Client-side routes such as /issues/ISS-1001 and /loop.
    location / {
        try_files $uri /index.html;
    }
}
